<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC問題集</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>SC問題集</h1>
    </header>
    <main>
        <section id="menu" class="disp">
            <h2>問題選択</h2>
            <div class="selection">
                <select id="year">
                    <option value="2025">２０２５（令和７）年度</option>
                    <option value="2024">２０２４（令和６）年度</option>
                    <option value="2023">２０２３（令和５）年度</option>
                    <option value="2022">２０２２（令和４）年度</option>
                    <option value="2021">２０２１（令和３）年度</option>
                    <option value="2020">２０２０（令和２）年度</option>
                    <option value="2019">２０１９（令和元年）年度</option>
                    <option value="2018">２０１８（令和元年）年度</option>
                </select>
                <select id="season">
                    <option value="a">秋</option>
                    <option value="h">春</option>
                </select>
                <select id="schedule">
                    <option value="am1">午前Ⅰ</option>
                    <option value="am2">午前Ⅱ</option>
                    <option value="pm">午後</option>
                </select>
                <button id="btn" onclick="switchExamPage();">Go</button>
            </div>
        </section>
        <!-- 試験問題のテンプレート -->
        <template id="exam-tamplate">
            <div class="next">></div>
            <div class="prev">
                < </div>
                    <div class="exam-content">
                        <h2></h2>
                        <p class="question">
                            <img src="" alt="問題本文">
                        </p>
                        <p class="answer">
                        </p>
                        <p class="result">
                        </p>
                        <div class="return">問題選択に戻る</div>
                    </div>
        </template>
        <!-- 試験問題 -->
        <section id="exam-container" class="hide">
        </section>
    </main>
    <footer>
        <p>
            出典元：IPA　独立行政法人　情報処理推進機構
        </p>
    </footer>

</body>

</html>
